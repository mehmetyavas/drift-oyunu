<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1026" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Drift</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%81%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1026; font-family: system-ui, sans-serif; color: #fff; }
      #app canvas { display: block; }
      #pairing { position: fixed; left: 24px; bottom: 24px; display: none; flex-direction: column; align-items: center; gap: 6px;
        background: rgba(0,0,0,.55); padding: 14px; border-radius: 12px; font-size: 14px; }
      #pairing img { border-radius: 6px; }
      #pairing code { opacity: .7; font-size: 12px; }
      #hud { position: fixed; right: 28px; top: 22px; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
      #hud .total { font-size: 34px; font-weight: 700; }
      #hud .best { font-size: 13px; opacity: .7; }
      #hud .combo { margin-top: 8px; font-size: 22px; color: #ffd27a; transition: opacity .2s; }
      #hud .mult { font-size: 28px; font-weight: 800; color: #ff8a5c; margin-left: 6px; }
      #hud .speed { margin-top: 10px; font-size: 14px; opacity: .7; }
      #stale { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 26px;
        text-shadow: 0 2px 8px rgba(0,0,0,.6); pointer-events: none; }
      #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #combo { --c: #fff; position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: 5%; display: flex; flex-direction: column;
        align-items: center; opacity: 0; pointer-events: none; text-shadow: 0 3px 12px rgba(0,0,0,.5); }
      #combo .label { font-size: 34px; font-weight: 900; letter-spacing: 6px; color: var(--c); font-style: italic; }
      #combo .ring { position: relative; width: 140px; height: 140px; margin: 4px 0; }
      #combo svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
      #combo circle { fill: rgba(0,0,0,.35); stroke-width: 7; }
      #combo .bg { stroke: rgba(255,255,255,.15); }
      #combo .fg { fill: none; stroke: var(--c); stroke-linecap: round; filter: drop-shadow(0 0 6px var(--c)); }
      #combo .mult { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 58px; font-weight: 900; color: var(--c); }
      #combo .pts { font-size: 44px; font-weight: 800; }
      #combo.lost { --c: #ff4a4a; }
      #combo .ring { animation: beat var(--beat, .9s) ease-in-out infinite; }
      @keyframes beat { 50% { transform: scale(var(--beatScale, 1)); } }
      #lines { position: fixed; inset: -20%; pointer-events: none; opacity: 0; mix-blend-mode: screen;
        background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.22) 0deg 1.2deg, transparent 1.2deg 9deg);
        -webkit-mask-image: radial-gradient(circle, transparent 38%, #000 70%); mask-image: radial-gradient(circle, transparent 38%, #000 70%);
        animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #vignette { --c: #000; position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, color-mix(in srgb, var(--c) 35%, #000) 100%); }
      #xhint { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); display: none; padding: 12px 22px; border-radius: 12px;
        font-size: 20px; font-weight: 800; background: linear-gradient(90deg,#ff2a3a,#ff8a2a); box-shadow: 0 0 24px #ff3a2a; pointer-events: none; }
      #countdown { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 160px;
        font-weight: 900; font-style: italic; text-shadow: 0 6px 30px rgba(0,0,0,.6); pointer-events: none; }
      #police { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
      #glow { --c: #fff; position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 120px 20px var(--c); }
      .fly { position: fixed; font-size: 40px; font-weight: 900; translate: -50% 0;
        text-shadow: 0 3px 12px rgba(0,0,0,.5); pointer-events: none; }
      #hud .total { transform-origin: right center; }
      #extreme { position: fixed; right: 28px; top: 132px; display: none; padding: 6px 14px; border-radius: 8px; font-weight: 900;
        letter-spacing: 3px; font-style: italic; background: linear-gradient(90deg,#ff2a3a,#ff8a2a); box-shadow: 0 0 18px #ff3a2a; }
      #biome { position: fixed; top: 42%; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 800;
        letter-spacing: 3px; text-shadow: 0 3px 14px rgba(0,0,0,.55); opacity: 0; transition: opacity .8s; pointer-events: none; }
      #sound { position: fixed; left: 24px; top: 20px; padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
        background: rgba(0,0,0,.55); color: #fff; font-size: 15px; }
      #hint { position: fixed; left: 24px; top: 64px; font-size: 12px; opacity: .6; }

      /* ---------- Multiplayer ---------- */
      :root { --glass: rgba(22, 12, 36, .62); --edge: rgba(255,255,255,.12); --hot: #ff3a6a; --warm: #ff8a2a;
        --ink: #fff; --mute: rgba(255,255,255,.62); --grad: linear-gradient(100deg, var(--hot), var(--warm)); }
      #mpBtn { position: fixed; left: 24px; top: 92px; padding: 11px 16px; border-radius: 14px; cursor: pointer; font: 800 14px system-ui;
        letter-spacing: .5px; color: var(--ink); background: var(--glass); border: 1px solid var(--edge);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .15s, border-color .15s; }
      #mpBtn:hover { transform: translateY(-1px); border-color: rgba(255,138,42,.6); }
      #mp { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
      .mp-scrim { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(10,4,20,.35), rgba(10,4,20,.75)); }
      .mp-card { position: relative; width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; border-radius: 24px;
        background: var(--glass); border: 1px solid var(--edge); box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
        backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); display: flex; flex-direction: column; gap: 14px; }
      .mp-wide { width: min(860px, 100%); }
      .mp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .mp-headr { display: flex; gap: 8px; flex-wrap: wrap; }
      .mp-title { font: italic 900 26px system-ui; letter-spacing: 3px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .mp-title.big { font-size: 44px; letter-spacing: 2px; }
      .mp-sub, .mp-foot, .mp-note, .mp-wait { color: var(--mute); font-size: 14px; margin: 0; }
      .mp-foot { font-size: 12px; }
      .mp-wait { text-align: center; padding: 12px; }
      .mp-kicker { font: 800 11px system-ui; letter-spacing: 2.5px; color: var(--mute); }
      .mp-room { font: italic 900 52px/1 ui-monospace, monospace; letter-spacing: 10px; margin-top: 4px; }
      .mp-x { background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
      .mp-x:hover { color: var(--ink); background: rgba(255,255,255,.08); }
      .mp-input { width: 100%; box-sizing: border-box; padding: 13px 15px; border-radius: 14px; border: 1px solid var(--edge);
        background: rgba(0,0,0,.28); color: var(--ink); font: 600 16px system-ui; outline: none; transition: border-color .15s, box-shadow .15s; }
      .mp-input:focus { border-color: var(--warm); box-shadow: 0 0 0 3px rgba(255,138,42,.25); }
      .mp-code { text-transform: uppercase; letter-spacing: 6px; text-align: center; font-family: ui-monospace, monospace; font-weight: 800; }
      .mp-grid2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
      .mp-join { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .mp-btn { padding: 13px 18px; border-radius: 14px; border: 1px solid var(--edge); background: rgba(255,255,255,.07); color: var(--ink);
        font: 800 15px system-ui; cursor: pointer; transition: transform .12s, background .15s, box-shadow .15s; }
      .mp-btn:hover:not(:disabled) { background: rgba(255,255,255,.13); transform: translateY(-1px); }
      .mp-btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
      .mp-btn:disabled { opacity: .45; cursor: default; }
      .mp-btn:focus-visible, .mp-mode:focus-visible, .mp-chip:focus-visible, .mp-seg button:focus-visible, .mp-toggle:focus-visible
        { outline: 2px solid var(--warm); outline-offset: 2px; }
      .mp-primary { border: 0; background: var(--grad); box-shadow: 0 8px 26px rgba(255,58,106,.35); }
      .mp-primary:hover:not(:disabled) { background: var(--grad); box-shadow: 0 10px 34px rgba(255,58,106,.55); }
      .mp-danger { border-color: rgba(255,74,74,.5); color: #ffb0b0; }
      .mp-go { width: 100%; padding: 18px; font: italic 900 20px system-ui; letter-spacing: 3px; }
      .mp-chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(0,0,0,.25); color: var(--ink);
        font: 700 12px system-ui; cursor: pointer; }
      .mp-chip:hover { border-color: rgba(255,255,255,.3); }
      .mp-err { padding: 10px 14px; border-radius: 12px; background: rgba(255,58,74,.15); border: 1px solid rgba(255,58,74,.4); color: #ffc2c2; font-size: 14px; }
      .mp-bento { display: grid; grid-template-columns: minmax(200px, 1fr) 2fr; gap: 12px; }
      .mp-tile { padding: 16px; border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
        display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .mp-players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .mp-players li { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,.18); min-width: 0; }
      .mp-players li.me { background: rgba(255,138,42,.12); }
      .mp-players .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .mp-players .tag { font-size: 11px; color: var(--mute); white-space: nowrap; }
      .mp-players .tag.you { color: var(--warm); font-weight: 800; }
      .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
      .mp-modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .mp-mode { text-align: left; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.2);
        color: var(--ink); cursor: pointer; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; transition: border-color .15s, background .15s, transform .12s; }
      .mp-mode:hover:not(:disabled) { border-color: rgba(255,255,255,.25); transform: translateY(-1px); }
      .mp-mode:disabled { cursor: default; }
      .mp-mode.on { border-color: var(--warm); background: linear-gradient(140deg, rgba(255,58,106,.22), rgba(255,138,42,.12)); }
      .mp-mode .ic { grid-row: span 2; font-size: 24px; align-self: center; }
      .mp-mode .mn { font: 800 15px system-ui; }
      .mp-mode .md { font-size: 12px; color: var(--mute); line-height: 1.35; }
      .mp-opts { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .mp-seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(0,0,0,.28); border: 1px solid var(--edge); }
      .mp-seg button { padding: 8px 14px; border: 0; border-radius: 9px; background: none; color: var(--mute); font: 800 13px system-ui; cursor: pointer; }
      .mp-seg button.on { background: rgba(255,255,255,.14); color: var(--ink); }
      .mp-toggle { padding: 9px 14px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(0,0,0,.28); color: var(--mute);
        font: italic 900 13px system-ui; letter-spacing: 2px; cursor: pointer; }
      .mp-toggle.on { color: #fff; border-color: transparent; background: linear-gradient(90deg,#ff2a3a,#ff8a2a); box-shadow: 0 0 18px rgba(255,58,42,.55); }
      .mp-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
      .mp-results { width: min(520px, 100%); text-align: center; }
      .mp-results .mp-actions { justify-content: center; }
      .mp-rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
      .mp-rank li { --c: #fff; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 12px 14px;
        border-radius: 14px; background: rgba(0,0,0,.25); border-left: 4px solid var(--c); }
      .mp-rank li.me { background: rgba(255,138,42,.14); }
      .mp-rank .pos { font: 900 22px system-ui; text-align: center; }
      .mp-rank .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mp-rank .val { font: 800 16px ui-monospace, monospace; }
      #board { position: fixed; left: 24px; top: 92px; display: none; min-width: 210px; padding: 10px; border-radius: 16px; background: var(--glass);
        border: 1px solid var(--edge); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: none; }
      #board .bd-head { font: italic 900 22px ui-monospace, monospace; text-align: center; padding: 2px 0 8px; letter-spacing: 1px; }
      #board .bd-head.hot { color: #ff5a5a; animation: beat .5s ease-in-out infinite; }
      #board .bd-row { display: grid; grid-template-columns: 18px 12px 1fr auto; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 9px; font-size: 14px; }
      #board .bd-row.me { background: rgba(255,138,42,.18); }
      #board .pos { font-weight: 900; opacity: .7; }
      #board .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
      #board .val { font: 700 13px ui-monospace, monospace; opacity: .85; }
      #camName { position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: var(--glass);
        border: 1px solid var(--edge); font: italic 900 14px system-ui; letter-spacing: 3px; opacity: 0; pointer-events: none; transition: opacity .3s; }
      @media (max-width: 720px) {
        .mp-bento, .mp-grid2 { grid-template-columns: 1fr; }
        .mp-modes { grid-template-columns: 1fr; }
        .mp-room { font-size: 40px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mp-btn, .mp-mode, #mpBtn { transition: none; }
        #board .bd-head.hot { animation: none; }
      }

      /* ---------- Lobby extras ---------- */
      .mp-players li.seat { background: none; border: 1px dashed rgba(255,255,255,.14); color: var(--mute); }
      .mp-players li.seat .dot { background: rgba(255,255,255,.18); box-shadow: none; animation: seat 1.6s ease-in-out infinite; }
      .mp-players li.seat .nm { font-weight: 500; font-style: italic; }
      @keyframes seat { 50% { opacity: .25; } }
      .mp-start { display: flex; flex-direction: column; gap: 8px; }
      .mp-start .mp-note { text-align: center; font-size: 13px; }
      .mp-pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warm); margin-right: 10px;
        vertical-align: middle; animation: seat 1.2s ease-in-out infinite; }
      #toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px;
        align-items: center; z-index: 30; pointer-events: none; }
      .toast { padding: 10px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--edge); font: 700 14px system-ui;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); white-space: nowrap; }

      /* ---------- Phone play ---------- */
      #touch { display: none; }
      html.touch, html.touch body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      .touch #touch { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      #touch button { pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        color: #fff; border: 1px solid var(--edge); background: rgba(22,12,36,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        transition: transform .08s, background .12s; }
      #touch button.on { transform: scale(.93); background: rgba(255,255,255,.22); }
      .tc-top { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px; }
      .tc-small { width: 44px; height: 44px; border-radius: 14px; font-size: 19px; line-height: 1; }
      .tc-pad { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); width: 88px; height: 88px; border-radius: 50%; font-size: 30px; }
      .tc-left { left: calc(16px + env(safe-area-inset-left)); }
      .tc-right { left: calc(116px + env(safe-area-inset-left)); }
      #touch[data-mode="tilt"] .tc-pad { width: 64px; height: 64px; font-size: 22px; opacity: .55; }
      #touch[data-mode="tilt"] .tc-right { left: calc(92px + env(safe-area-inset-left)); }
      #touch[data-mode="buttons"] .tc-center, #touch[data-mode="buttons"] .tc-flip, #touch[data-mode="buttons"] .tc-wheel { display: none; }
      .tc-pedal { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 26px;
        font: italic 900 15px system-ui; letter-spacing: 2px; }
      .tc-nitro { right: calc(16px + env(safe-area-inset-right)); background: linear-gradient(160deg, rgba(58,140,255,.55), rgba(22,12,36,.45)) !important; }
      .tc-brake { right: calc(130px + env(safe-area-inset-right)); background: linear-gradient(160deg, rgba(255,58,90,.5), rgba(22,12,36,.45)) !important; }
      .tc-wheel { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom)); left: 50%; width: 46px; height: 46px; border-radius: 50%;
        border: 6px solid rgba(255,107,90,.75); transform: translateX(-50%); box-sizing: border-box; }
      .tc-wheel::before { content: ""; position: absolute; left: 50%; top: -9px; width: 6px; height: 12px; margin-left: -3px; border-radius: 3px; background: #fff; }
      .tc-rotate { display: none; }
      @media (orientation: portrait) {
        .touch .tc-rotate { display: block; position: fixed; top: 38%; left: 50%; transform: translateX(-50%); padding: 12px 18px; border-radius: 16px;
          background: var(--glass); border: 1px solid var(--edge); font: 800 15px system-ui; white-space: nowrap; }
      }
      .touch #pairing, .touch #hint, .touch #sound, .touch #xhint { display: none !important; }
      .touch #mpBtn { top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 9px 12px; font-size: 13px; }
      .touch #hud { top: 62px; right: max(14px, env(safe-area-inset-right)); }
      .touch #hud .total { font-size: 24px; }
      .touch #board { top: 58px; left: max(12px, env(safe-area-inset-left)); zoom: .8; }
      .touch #combo { zoom: .62; }
      .touch #countdown { font-size: 110px; }
      .touch #biome { font-size: 28px; }
      .touch #camName { bottom: auto; top: 64px; }
      .touch .mp-card { padding: 16px; }
      /* Short screens (phones in landscape): compact lobby, the start button always in reach. */
      .mp-card > .mp-start, .mp-card > .mp-actions, .mp-card > .mp-wait { position: sticky; bottom: -24px; margin: 0 -24px -24px;
        padding: 12px 24px 24px; background: linear-gradient(to bottom, transparent, rgba(22,12,36,.96) 28%); }
      @media (max-height: 540px) {
        .mp-card { gap: 8px; padding: 12px 16px; }
        .mp-card > .mp-start, .mp-card > .mp-actions, .mp-card > .mp-wait { bottom: -12px; margin: 0 -16px -12px; padding: 8px 16px 12px; }
        .mp-room { font-size: 30px; letter-spacing: 6px; }
        .mp-title.big { font-size: 30px; }
        .mp-tile { padding: 10px; gap: 8px; }
        .mp-mode { padding: 8px 10px; }
        .mp-mode .md { display: none; }
        .mp-mode .ic { font-size: 18px; grid-row: auto; }
        .mp-players li { padding: 5px 8px; }
        .mp-players li.seat ~ li.seat { display: none; }
        .mp-go { padding: 12px; font-size: 16px; }
        .mp-start .mp-note { font-size: 11px; }
        .mp-rank li { padding: 7px 10px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="stale">Kontrolcü bağlantısı koptu</div>
    <div id="flash"></div>
    <div id="pairing"></div>
    <div id="biome"></div>
    <div id="extreme">EXTREME</div>
    <div id="vignette"></div>
    <div id="lines"></div>
    <div id="glow"></div>
    <div id="xhint">🔥 EXTREME modu dene! Telefonda <b>EXTREME</b>'e bas ya da klavyede <b>E</b></div>
    <div id="police"></div>
    <div id="countdown"></div>
    <div id="combo">
      <div class="label"></div>
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44" /><circle class="fg" cx="50" cy="50" r="44" /></svg>
        <div class="mult"></div>
      </div>
      <div class="pts"></div>
    </div>
    <button id="sound">🔊 Sesi aç</button>
    <div id="hint">M: ses · C: kamera · Esc: çok oyunculu</div>
    <button id="mpBtn">👥 Çok oyunculu</button>
    <div id="board" aria-live="polite"></div>
